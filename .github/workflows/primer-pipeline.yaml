# Nombre visible en Actions
name: Fundamentos DevSecOps - Bloque 1

# Eventos que inician la automatización
on: 
  # Ejecutar cuando se envía un cambio al repositorio
  push: 
  # Permite también una ejecución manual
  workflow_dispatch:
# El token automatico solonecesita lectura
permissions:
  contents: read

# Trabajos que forma el pipeline
jobs:
  # Primer trabajo: revisar la configuracion
  validar:
    # Maquina donde de se ejecutarán los pasos
    runs-on: ubuntu-latest
    # Limite duracion de trabajo
    timeout-minutes: 5
    # Pasos que se van a ejecutar en orden
    steps:
        # Obtener los archivos del repositorio
      - name: Obtener archivos del repositorio
        uses: actions/checkout@v6
        with:
          # No conservar credenciales para comandos posteriores
          persist-credencials: false
        # Verificamos la existencia de archivos
      - name: Verificar existencia de archivos
        run: test -f configuracion.txta

        # Mostrar el dato ficticio que vamos revisar
      - name: Mostrar configuracion de ejemplo
        run: cat configuracion.txt

      # Aplicar la regla acordada
      - name: Comprobar regla de configuracion
        shell: bash
        run: |
          # Comprobar el contendio con el valor esperado
          if[ "$(cat configuracion.txt)" = "DEBUG=false" ]; then
            # Registrar que la regla se cumplio
            echo "Control Aprobado"
          else
            # Informar el motivo rechazado
            echo "CONTROL RECHAZADO": se esperaba DEBUG=false
            # Terminar conun código de error
            exit 1
          fi

    # Segundo trabajo: representar unaetpa posterior
  entrega_simulada:
        # Depender del exito del primer trabajo
        needs: validar
        runs-on: ubuntu-latest

        steps:
        # Mostrar que se permitio continuar
        - name: Representar la siguiente etapa
          run: echo "Entrega simulada autorizada"

          
