# Nombre visible en Actions.
name: Fundamentos DevSecOps - Bloque 1

# Eventos que inician la automatización.
on:
  # Ejecutar cuando se envía un cambio al repositorio.
  push:
  # Permitir también una ejecución manual.
  workflow_dispatch:

# El token automático solo necesita lectura.
permissions:
  contents: read

# Trabajos que forman el pipeline.
jobs:
  # Primer trabajo: revisar la configuración.
  validar:
    # Máquina donde se ejecutarán los pasos.
    runs-on: ubuntu-latest

    # Límite de duración del trabajo.
    timeout-minutes: 5

    # Pasos que se ejecutan en orden.
    steps:
      # Obtener los archivos del repositorio.
      - name: Obtener archivos del repositorio
        uses: actions/checkout@v6
        with:
          # No conservar credenciales para comandos posteriores.
          persist-credentials: false

      # Verificar que exista el archivo de entrada.
      - name: Verificar existencia del archivo
        run: test -f configuracion.txt

      # Mostrar el dato ficticio que vamos a revisar.
      - name: Mostrar configuracion de ejemplo
        run: cat configuracion.txt

      # Aplicar la regla acordada.
      - name: Comprobar regla de configuracion
        shell: bash
        run: |
          # Comparar el contenido con el valor esperado.
          if [ "$(cat configuracion.txt)" = "DEBUG=false" ]; then
            # Registrar que la regla se cumplió.
            echo "CONTROL APROBADO"
          else
            # Informar el motivo del rechazo.
            echo "CONTROL RECHAZADO: se esperaba DEBUG=false"

            # Terminar con un código de error.
            exit 1
          fi

  # Segundo trabajo: representar una etapa posterior.
  entrega_simulada:
    # Depender del éxito del primer trabajo.
    needs: validar

    # Este trabajo utiliza su propio runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Mostrar que se permitió continuar.
      - name: Representar la siguiente etapa
        run: echo "ENTREGA SIMULADA AUTORIZADA"
